services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novintix
      POSTGRES_USER: novintix
      POSTGRES_PASSWORD: novintix
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novintix']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis_data:/data]
  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate -w @novintix/backend && npm run dev -w @novintix/backend"
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql://novintix:novintix@postgres:5432/novintix?schema=public
      REDIS_URL: redis://redis:6379
    volumes: [.:/app, backend_uploads:/app/backend/uploads]
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @novintix/frontend"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    volumes: [.:/app]
    ports: ['3000:3000']
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  backend_uploads:
